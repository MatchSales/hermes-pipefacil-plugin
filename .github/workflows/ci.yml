name: HTTP plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [official, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - name: Test against unmodified Hermes
        env:
          TEST_SOURCE: ${{ matrix.source }}
        run: |
          docker run --rm --entrypoint /bin/sh -w /tmp \
            -v "$PWD:/plugin:ro" -e TEST_SOURCE \
            -e HERMES_HOME=/tmp/hermes-http-tests \
            -e HERMES_RUNTIME_DIR=/tmp/hermes-http-runtime \
            nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db \
            -c 'set -eu
              cp -a /plugin /tmp/plugin
              uv pip install --python /opt/hermes/.venv/bin/python -r /tmp/plugin/requirements-test.txt
              HERMES_SOURCE=/opt/hermes
              TEST_PYTHON=/opt/hermes/.venv/bin/python
              if [ "$TEST_SOURCE" = current ]; then
                git clone --depth=1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-current
                git -C /tmp/hermes-current rev-parse HEAD
                HERMES_SOURCE=/tmp/hermes-current
                # Current Hermes supports Python 3.14; the pinned image uses 3.13.
                uv venv --python 3.14 /tmp/hermes-current-tests
                TEST_PYTHON=/tmp/hermes-current-tests/bin/python
                uv pip install --python "$TEST_PYTHON" -e "$HERMES_SOURCE" \
                  -r /tmp/plugin/requirements-test.txt aiohttp
              fi
              export HERMES_SOURCE PYTHONPATH="$HERMES_SOURCE:/tmp/plugin/tests"
              "$TEST_PYTHON" -c "import gateway.platforms.base; print(gateway.platforms.base.__file__)"
              "$TEST_PYTHON" -m pytest --import-mode=importlib /tmp/plugin/tests -q'
  media-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test infra/r2-media/worker.test.mjs
